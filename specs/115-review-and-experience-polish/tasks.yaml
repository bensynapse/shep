name: review-and-experience-polish
phase: Implementation
summary: Four dependency-ordered review, implementation and verification tasks.
tasks:
  - id: task-1
    phaseId: phase-1
    title: Audit and regression repairs
    state: Done
    dependencies: []
    acceptanceCriteria:
      - Applicable review surfaces recorded
      - Verified failures repaired with regression coverage
    tdd:
      red:
        - Reproduce source defects with targeted failing tests
      green:
        - Repair the demonstrated root cause
      refactor:
        - Review changes for duplication and unnecessary state; retain passing regression checks
  - id: task-2
    phaseId: phase-2
    title: Application workspace discovery and presentation
    state: Done
    dependencies:
      - task-1
    acceptanceCriteria:
      - Search and status filters work together
      - Responsive presentation preserves all existing actions
      - Working stories cover loaded, empty, loading and failed states
    tdd:
      red:
        - Write tests for search, filters, loading announcements and import errors
      green:
        - Implement discovery and responsive workspace with the existing data flow
      refactor:
        - Review changes for duplication and unnecessary state; retain passing regression checks
  - id: task-3
    phaseId: phase-3
    title: Browser verification and quality gates
    state: Done
    dependencies:
      - task-2
    acceptanceCriteria:
      - Regression tests pass
      - Browser evidence covers desktop, mobile, light and dark
      - Quality gate outcomes and limitations recorded
    tdd:
      red:
        - Exercise browser interactions and detect rendering or accessibility failures
      green:
        - Repair verified regressions and rerun affected checks
      refactor:
        - Review changes for duplication and unnecessary state; retain passing regression checks
  - id: task-4
    phaseId: phase-4
    title: Close remaining merge, dependency and browser coverage gaps
    state: Done
    dependencies:
      - task-3
    acceptanceCriteria:
      - Remote PR completion is verified before branch and worktree cleanup
      - No expected-failure test remains without a resolved behavioral contract
      - Dependency path traversal regressions are prevented by tested dependency patches
      - Available browser workflows and final quality gates are exercised
      - >-
        Async HTTP handler failures are contained and browser aborts produce no uncaught request
        errors
    tdd:
      red:
        - Reproduce queued PR cleanup and dependency path traversal with isolated fixtures
        - Run previously omitted browser scenarios against an isolated instance
      green:
        - Fix confirmed defects and rerun affected scenarios
      refactor:
        - Preserve existing contracts and record evidence and environment limits
content: >
  ## Acceptance


  Tests, stories, screenshots and quality-gate logs are recorded in evidence and the review run. No
  claim of universal correctness is implied.


  ## Completed verification


  The final full suites passed 1,057 unit files / 12,606 tests and 152 integration files / 1,749
  tests with no expected failures. All 29 standard browser scenarios passed without skips, and 87
  CLI/TUI end-to-end tests passed. Release and Storybook builds, root and web typechecks, lint,
  formatting, story coverage and the frozen lockfile install passed. Twelve dependency traversal
  regressions pass with pinned local patches; the four raw version-based audit matches remain
  visible and are documented. See [the review record](evidence/review-report.yaml) for fixes,
  coverage, provenance and environment limits.
totalEstimate: L
