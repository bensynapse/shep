name: review-and-experience-polish
phase: Planning
summary: >-
  Review first, implement tested repairs, improve the existing application surface, then verify
  behavior and record evidence.
openQuestions: []
phases:
  - id: phase-1
    name: Audit and regression repairs
    parallel: false
    description: >-
      RED: reproduce an observed failure or missing user behavior. GREEN: implement the smallest
      cohesive repair. REFACTOR: integrate with existing patterns and verify affected checks.
  - id: phase-2
    name: Application workspace discovery and presentation
    parallel: false
    description: >-
      RED: reproduce an observed failure or missing user behavior. GREEN: implement the smallest
      cohesive repair. REFACTOR: integrate with existing patterns and verify affected checks.
  - id: phase-3
    name: Browser verification and quality gates
    parallel: false
    description: >-
      RED: reproduce an observed failure or missing user behavior. GREEN: implement the smallest
      cohesive repair. REFACTOR: integrate with existing patterns and verify affected checks.
  - id: phase-4
    name: Close remaining review gaps
    parallel: false
    description: >-
      RED: reproduce queued PR cleanup, archive traversal and TypeSpec output traversal in isolated
      fixtures, and exercise previously omitted browser workflows. GREEN: repair the confirmed
      failures. REFACTOR: retain existing architecture and verify final gates. Contain
      browser-observed asynchronous HTTP handler failures with focused tests and a shared
      infrastructure adapter.
filesToModify:
  - src/presentation/web/components/features/applications/applications-page-client.tsx
  - src/presentation/web/components/features/applications/applications-page-client.stories.tsx
  - src/presentation/web/components/features/applications/application-card.tsx
content: >
  ## Architecture

  Follow Clean Architecture; keep discovery in the presentation layer using existing domain status.
  RED-GREEN-REFACTOR is required for every behavior change. Preserve query caching, polling,
  stale-data recovery and imports. Test before changing implementation. Roll back only changes owned
  by this review.
filesToCreate:
  - packages/core/src/infrastructure/services/http-request-listener.ts
  - tests/unit/infrastructure/services/http-request-listener.test.ts
  - tests/integration/security/dependency-path-traversal.test.ts
  - patches/extract-zip@2.0.1.patch
  - patches/@typespec__openapi3@0.60.0.patch
