name: PR 880 Windows reproduction

on:
  push:
    branches: [ci/pr880-windows-diagnostic]

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build Windows SQLite from source
        env:
          npm_config_build_from_source: 'true'
        run: pnpm rebuild better-sqlite3
      - run: pnpm build:release
      - name: Repeat full CLI suite under the original parallel workload
        env:
          SHEP_E2E_USE_DIST: '1'
        shell: pwsh
        run: |
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            Write-Output "Full CLI suite attempt $attempt"
            pnpm exec vitest run tests/e2e/cli --reporter=verbose
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
