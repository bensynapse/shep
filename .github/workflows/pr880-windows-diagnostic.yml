name: PR 880 Windows startup verification

on:
  push:
    branches: [ci/pr880-windows-diagnostic]

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Report Docker engine platform
        shell: pwsh
        run: |
          docker info --format '{{.OSType}}'
          if ($LASTEXITCODE -ne 0) { Write-Output 'Docker engine is unavailable' }
          exit 0
      - run: pnpm build:cli
      - name: Verify startup lock and settings regressions
        run: pnpm exec vitest run tests/unit/infrastructure/persistence/sqlite/connection-lifecycle.test.ts tests/unit/infrastructure/persistence/sqlite/connection-native-binding.test.ts tests/unit/application/use-cases/initialize-settings.use-case.test.ts tests/integration/infrastructure/repositories/sqlite-settings.repository.test.ts
      - name: Repeat simultaneous CLI startup on Windows
        env:
          SHEP_E2E_USE_DIST: '1'
        shell: pwsh
        run: |
          for ($attempt = 1; $attempt -le 20; $attempt++) {
            Write-Output "Concurrent startup attempt $attempt"
            pnpm exec vitest run tests/e2e/cli/settings-initialization.test.ts -t 'concurrent CLI' --reporter=verbose
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
