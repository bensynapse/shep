name: PR 880 Windows startup verification

on:
  push:
    branches: [ci/pr880-windows-diagnostic]

permissions:
  contents: read

jobs:
  native:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Capture native SQLite read-write-open-close error codes
        run: node scripts/diagnose-windows-sqlite-exit.mjs
  reproduce:
    if: false
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:cli
      - name: Repeat full CLI workload on Windows
        env:
          SHEP_E2E_USE_DIST: '1'
        shell: pwsh
        run: |
          for ($attempt = 1; $attempt -le 10; $attempt++) {
            Write-Output "Feature startup attempt $attempt"
            pnpm run test:e2e:cli
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
